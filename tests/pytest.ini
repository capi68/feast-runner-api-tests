[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short --alluredir=allure-results
markers =
    smoke: Quick tests for basic functionality
    regression: Full regression test suite
    restaurants: Tests related to restaurants entity
    menus: Tests related to menus entity
    menu_items: Tests related to menu items entity
    customers: Tests related to customers entity
    addresses: Tests related to addresses entity
    couriers: Tests related to couriers entity
    orders: Tests related to orders entity
    order_items: Tests related to order items entity
    deliveries: Tests related to deliveries entity
    ratings: Tests related to ratings entity
    auth: Tests related to authentication
    prueba: tests prueba
